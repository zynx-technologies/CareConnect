parameters:
  - name: environment
    type: string
  - name: dependsOn
    type: string

stages:
  - stage: Deploy_${{ parameters.environment }}
    dependsOn: ${{ parameters.dependsOn }}
    variables:
      - group: careconnect-${{ parameters.environment }}
    jobs:
      - deployment: Deploy
        # Add approvals and checks to this environment in Azure DevOps. Production must have them.
        environment: careconnect-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: TerraformInstaller@1
                  inputs:
                    terraformVersion: '1.15.8'
                - task: AzureCLI@2
                  displayName: Apply infrastructure and images
                  inputs:
                    azureSubscription: careconnect-azure
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"
                      export ARM_USE_OIDC=true
                      export ARM_OIDC_TOKEN="$idToken"
                      cd infra/terraform
                      terraform init -input=false \
                        -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
                        -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
                        -backend-config="container_name=tfstate" \
                        -backend-config="key=careconnect-${{ parameters.environment }}.tfstate" \
                        -backend-config="use_azuread_auth=true"
                      terraform plan -input=false -out=tfplan \
                        -var-file="env/${{ parameters.environment }}.tfvars" \
                        -var="acr_name=$ACR_NAME" \
                        -var="acr_resource_group=$ACR_RESOURCE_GROUP" \
                        -var="api_image=careconnect-api:$IMAGE_TAG" \
                        -var="web_image=careconnect-web:$IMAGE_TAG" \
                        -var="allowed_cidrs=$ALLOWED_CIDRS" \
                        -var="entra_tenant_id=$tenantId" \
                        -var="entra_api_client_id=$ENTRA_API_CLIENT_ID" \
                        -var="entra_spa_client_id=$ENTRA_SPA_CLIENT_ID" \
                        -var="ai_enabled=$AI_ENABLED"
                      terraform apply -input=false tfplan
                - task: AzureCLI@2
                  displayName: Check the new revisions are healthy
                  inputs:
                    azureSubscription: careconnect-azure
                    scriptType: bash
                    scriptLocation: scriptPath
                    scriptPath: azure-pipelines/scripts/verify-deployment.sh
                    arguments: rg-careconnect-${{ parameters.environment }} $(IMAGE_TAG)
