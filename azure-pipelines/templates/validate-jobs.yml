jobs:
  - job: Backend
    displayName: Backend tests
    steps:
      - task: JavaToolInstaller@1
        inputs:
          versionSpec: '21'
          jdkArchitectureOption: x64
          jdkSourceOption: PreInstalled
      - script: |
          set -euo pipefail
          chmod +x backend/mvnw
          (cd backend && ./mvnw -B verify)
        displayName: Unit and API tests (H2)
      - task: PublishTestResults@2
        condition: succeededOrFailed()
        inputs:
          testResultsFiles: backend/target/surefire-reports/*.xml

  - job: BackendSqlServer
    displayName: Backend tests on SQL Server
    steps:
      - task: JavaToolInstaller@1
        inputs:
          versionSpec: '21'
          jdkArchitectureOption: x64
          jdkSourceOption: PreInstalled
      - script: |
          set -euo pipefail
          # A throwaway password for a container that exists only for this job.
          PASSWORD="Cc1-$(openssl rand -hex 16)"
          echo "##vso[task.setvariable variable=SQL_PASSWORD;issecret=true]$PASSWORD"
          docker run -d --name sql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$PASSWORD" -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 60); do
            docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$PASSWORD" -Q "IF DB_ID('careconnect') IS NULL CREATE DATABASE careconnect" && exit 0
            sleep 2
          done
          exit 1
        displayName: Start SQL Server
      - script: |
          chmod +x backend/mvnw
          cd backend && ./mvnw -B test
        displayName: Tests against SQL Server
        env:
          SPRING_DATASOURCE_URL: jdbc:sqlserver://localhost:1433;database=careconnect;encrypt=true;trustServerCertificate=true
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: $(SQL_PASSWORD)

  - job: Frontend
    displayName: Frontend tests and build
    steps:
      - task: UseNode@1
        inputs:
          version: '24.x'
      - script: |
          set -euo pipefail
          cd frontend
          npm ci
          npm audit --omit=dev --audit-level=high
          CI=1 npx ng test --watch=false
          npx ng build
        displayName: Audit, test, and build

  - job: Terraform
    displayName: Terraform checks
    steps:
      - task: TerraformInstaller@1
        inputs:
          terraformVersion: '1.15.8'
      - script: |
          set -euo pipefail
          cd infra/terraform
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
        displayName: Format and validate
