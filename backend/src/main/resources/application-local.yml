# Local development only. Uses an in-memory database, synthetic demo data, and header-based sign-in.
spring:
  datasource:
    url: jdbc:h2:mem:careconnect;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
  flyway:
    locations: classpath:db/migration
  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.web.OAuth2ResourceServerAutoConfiguration
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.OAuth2ResourceServerAutoConfiguration

careconnect:
  ai:
    enabled: true
    provider: extractive
  demo-data:
    enabled: true
