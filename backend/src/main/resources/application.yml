spring:
  application:
    name: careconnect-api
  datasource:
    url: ${DATABASE_URL:}
  flyway:
    locations: classpath:db/migration,classpath:db/vendor/{vendor}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI:}
          audiences: ${ENTRA_API_AUDIENCE:}

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

careconnect:
  ai:
    # Kill switch. When false, no draft can be generated and existing screens keep working.
    enabled: ${CARECONNECT_AI_ENABLED:false}
    # extractive: quotes source notes and uses no language model. azure-openai: calls a deployed model.
    provider: ${CARECONNECT_AI_PROVIDER:extractive}
    azure-openai:
      endpoint: ${AZURE_OPENAI_ENDPOINT:}
      deployment: ${AZURE_OPENAI_DEPLOYMENT:}
  access:
    emergency-minutes: 240
  # Census days and "today" follow the hospital's time zone.
  site-zone: ${CARECONNECT_SITE_ZONE:Australia/Sydney}
  demo-data:
    # Synthetic people and analytics for dev and local only. Terraform refuses it in production.
    enabled: ${CARECONNECT_DEMO_DATA_ENABLED:false}
    # Comma-separated user IDs added to the demo care team at each daily reload.
    care-team: ${CARECONNECT_DEMO_CARE_TEAM:}

logging:
  level:
    root: INFO
    # HAPI logs message content at debug level, which would put patient data in the logs.
    ca.uhn.hl7v2: WARN
