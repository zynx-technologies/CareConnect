spring:
  datasource:
    url: jdbc:h2:mem:careconnect-test;MODE=MSSQLServer;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
  flyway:
    locations: classpath:db/migration,classpath:db/local,classpath:db/vendor/{vendor}

careconnect:
  ai:
    enabled: true
    provider: extractive
