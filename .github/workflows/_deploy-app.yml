name: Deploy app (reusable)

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      image_tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    # Add required reviewers to this environment. Production must have them.
    environment: careconnect-${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: rg-careconnect-${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      REGISTRY: ${{ vars.ACR_NAME }}.azurecr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Update the apps
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          if ! az containerapp show -g "$RESOURCE_GROUP" -n careconnect-api --query name -o none 2>/dev/null; then
            echo "::error::This environment has no apps yet. Run the Infrastructure workflow with image tag $IMAGE_TAG first." >&2
            exit 1
          fi
          # The API goes first, so the portal never calls an older API.
          az containerapp update -g "$RESOURCE_GROUP" -n careconnect-api --image "$REGISTRY/careconnect-api:$IMAGE_TAG" --output none
          az containerapp update -g "$RESOURCE_GROUP" -n careconnect-web --image "$REGISTRY/careconnect-web:$IMAGE_TAG" --output none
      - name: Check the new revisions are healthy
        run: bash .github/scripts/verify-deployment.sh "$RESOURCE_GROUP" "$IMAGE_TAG"
